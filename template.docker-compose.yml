services:
  web:
    build: ./Ghost.Web
    container_name: ghost-web
    ports:
      - ${WEB_PORT}:3000
    environment:
      - VITE_APP_SERVER_URL=${API_HOST}
  api:
    build: .
    container_name: ghost-api
    ports:
      - ${API_PORT}:5120
    volumes:
      - $(pwd)/videos:/media/videos
      - $(pwd)/data:/data
      - $(pwd)/assets:/data/assets
    environment:
      - DATABASE_PATH=${DATABASE_PATH}
      - ASSETS_PATH=${ASSETS_PATH}
      - JWT_ISSUER=${API_HOST}
      - JWT_AUDIENCE=${WEB_HOST}
      - JWT_EXPIRY=1440
